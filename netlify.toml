[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/staking/*"
  to = "/.netlify/functions/staking/:splat"
  status = 200

[[redirects]]
  from = "/api/ipfs-proxy"
  to = "/.netlify/functions/ipfs-proxy"
  status = 200

[[redirects]]
  from = "/api/users/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
